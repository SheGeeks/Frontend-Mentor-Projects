<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
</head>

<body>
  <main class="card-component">
    <h1 class="sr-only">Frontend Mentor QR Code</h1>
    <div class="card-code">
      <img src="images/image-qr-code.png" class="qr-code" alt="QR Code to FrontendMentor.io"
        title="Scan to code with Frontend Mentor">
      <small class="notice transition">Use your phone to scan.</small>
    </div>
    <div class="card-content">
      <p class="p-featured">Improve your front-end skills by building projects</p>
      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>
  <footer>
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://dev.shegeeks.net">Corvida Raven</a>.
    </p>
  </footer>
</body>

</html>
