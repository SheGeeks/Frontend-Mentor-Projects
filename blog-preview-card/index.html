<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main>
    <h1 class="sr-only">Blog Preview</h1>
    <div class="card">
      <img src="assets/images/illustration-article.svg" alt="" class="card-img">
      <div class="card-content">
        <p class="card-label small bold">Learning</p>
        <p class="card-date small medium">Published 21 Dec 2023</p>
        <p class="card-title bold">HTML & CSS foundations</p>
        <p class="card-desc medium">These languages are the backbone of every website, defining structure, content, and
          presentation.</p>
      </div>
      <div class="card-author bold">
        <img src="assets/images/image-avatar.webp" alt="">
        <p>Greg Hooper</p>
      </div>
    </div>
  </main>
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://dev.shegeeks.net">Corvida Raven</a>.
    </div>
  </footer>
</body>

</html>
